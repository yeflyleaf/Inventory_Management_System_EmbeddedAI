spring.application.name=Backend
server.port=8080

# ============================================================================
# 数据源配置
# 生产环境通过环境变量覆盖，开发环境使用默认值
# ============================================================================
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:demo2}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USERNAME:user1}
spring.datasource.password=${MYSQL_PASSWORD:user1}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.backend.entity
mybatis.configuration.map-underscore-to-camel-case=true

# SQL 初始化配置 (替代 Flyway)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=${SPRING_SQL_INIT_DATA_LOCATIONS:classpath:data.sql}
spring.sql.init.encoding=UTF-8
spring.sql.init.separator=;

# ============================================================================
# Redis 配置
# 生产环境通过环境变量覆盖
# ============================================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6370}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.password=${REDIS_PASSWORD:}

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# 上传文件存储路径
file.upload.path=D:/OneDrive/Desktop/Uploads

# ============================================================================
# Actuator 配置 (健康检查)
# 专门针对Docker
# ============================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# ============================================================================
# AI 嵌入及微服务配置
# ============================================================================
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}

